# Deterministic OMNE OS ISO configuration.
# Package names, architecture, volume id, and ESP size are pinned here.
# Ubuntu mirror versions are whatever noble serves at build time; they are recorded
# in the image manifest and are not part of the build id.
OMNE_ISO_ARCH=amd64
OMNE_ISO_VOLUME_ID=OMNE
OMNE_ISO_ESP_MIB=256
OMNE_ISO_PACKAGES=(
  ca-certificates
  iproute2
  labwc
  libdrm2
  libegl1
  libgl1-mesa-dri
  libinput10
  seatd
  systemd-boot-efi
  systemd-sysv
)
