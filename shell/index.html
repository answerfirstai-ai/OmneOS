<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OMNE OS</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="desktop" id="desktop">
      <nav class="icons" aria-label="Desktop">
        <button type="button" class="icon" data-launch="core" aria-pressed="false">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="7"></circle>
            <path d="M16 4v4M16 24v4M4 16h4M24 16h4"></path>
          </svg>
          <span>Core</span>
        </button>
        <button type="button" class="icon" data-launch="launcher" aria-pressed="true">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M8 9h16M8 16h10M8 23h16"></path>
          </svg>
          <span>Launcher</span>
        </button>
        <button type="button" class="icon" data-launch="tasks" aria-pressed="true">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect x="7" y="6" width="18" height="20" rx="2"></rect>
            <path d="M12 13h8M12 18h8"></path>
          </svg>
          <span>Tasks</span>
        </button>
        <button type="button" class="icon" data-launch="agents" aria-pressed="false">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <circle cx="21" cy="13" r="2.5"></circle>
            <path
              d="M6 23c1.2-3 3.4-4.5 6-4.5s4.8 1.5 6 4.5M18 21c.8-2 2.2-3 4-3 1.6 0 2.8.8 3.6 2.4"
            ></path>
          </svg>
          <span>Agents</span>
        </button>
        <button type="button" class="icon" data-launch="models" aria-pressed="false">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect x="8" y="8" width="16" height="16" rx="3"></rect>
            <path d="M13 16h6M16 13v6"></path>
          </svg>
          <span>Models</span>
        </button>
        <button type="button" class="icon" data-launch="notifications" aria-pressed="false">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M10 22h12l-1.4-2.2V14a4.6 4.6 0 0 0-9.2 0v5.8z"></path>
            <path d="M14 24a2 2 0 0 0 4 0"></path>
          </svg>
          <span>Notices</span>
        </button>
        <button type="button" class="icon" data-launch="voice" aria-pressed="false">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect x="13" y="6" width="6" height="12" rx="3"></rect>
            <path d="M10 15a6 6 0 0 0 12 0M16 21v4"></path>
          </svg>
          <span>Voice</span>
        </button>
      </nav>

      <div class="workspace">
        <article
          class="window"
          id="window-core"
          data-window="core"
          hidden
          aria-labelledby="core-title"
        >
          <header class="titlebar">
            <h2 id="core-title">Core</h2>
            <button type="button" class="close" data-close="core" aria-label="Close Core">×</button>
          </header>
          <div class="window-body">
            <p id="status" data-state="checking">checking</p>
            <p id="detail"></p>
            <button id="refresh" type="button">Check again</button>
          </div>
        </article>

        <article
          class="window is-open"
          id="window-launcher"
          data-window="launcher"
          aria-labelledby="launcher-title"
        >
          <header class="titlebar">
            <h2 id="launcher-title">Launcher</h2>
            <button type="button" class="close" data-close="launcher" aria-label="Close Launcher">
              ×
            </button>
          </header>
          <form id="launcher" class="window-body">
            <label for="objective">Objective</label>
            <input
              id="objective"
              name="objective"
              type="text"
              placeholder="write file notes.txt with content hello"
            />
            <button type="submit">Run</button>
            <p id="launch-result"></p>
          </form>
        </article>

        <article
          class="window is-open is-focused"
          id="window-tasks"
          data-window="tasks"
          aria-labelledby="tasks-title"
        >
          <header class="titlebar">
            <h2 id="tasks-title">Tasks</h2>
            <button type="button" class="close" data-close="tasks" aria-label="Close Tasks">
              ×
            </button>
          </header>
          <div class="window-body">
            <ul id="tasks"></ul>
          </div>
        </article>

        <article
          class="window"
          id="window-agents"
          data-window="agents"
          hidden
          aria-labelledby="agents-title"
        >
          <header class="titlebar">
            <h2 id="agents-title">Agents</h2>
            <button type="button" class="close" data-close="agents" aria-label="Close Agents">
              ×
            </button>
          </header>
          <div class="window-body">
            <ul id="agents"></ul>
          </div>
        </article>

        <article
          class="window"
          id="window-models"
          data-window="models"
          hidden
          aria-labelledby="models-title"
        >
          <header class="titlebar">
            <h2 id="models-title">Models</h2>
            <button type="button" class="close" data-close="models" aria-label="Close Models">
              ×
            </button>
          </header>
          <div class="window-body">
            <ul id="models"></ul>
          </div>
        </article>

        <article
          class="window"
          id="window-notifications"
          data-window="notifications"
          hidden
          aria-labelledby="notifications-title"
        >
          <header class="titlebar">
            <h2 id="notifications-title">Notifications</h2>
            <button
              type="button"
              class="close"
              data-close="notifications"
              aria-label="Close Notifications"
            >
              ×
            </button>
          </header>
          <div class="window-body">
            <ul id="notifications"></ul>
          </div>
        </article>

        <article
          class="window"
          id="window-voice"
          data-window="voice"
          hidden
          aria-labelledby="voice-title"
        >
          <header class="titlebar">
            <h2 id="voice-title">Voice</h2>
            <button type="button" class="close" data-close="voice" aria-label="Close Voice">
              ×
            </button>
          </header>
          <div class="window-body">
            <p id="voice-status">unavailable</p>
            <button id="voice-listen" type="button" disabled>Listen</button>
          </div>
        </article>
      </div>
    </div>

    <div id="start-menu" class="start-menu" hidden>
      <p class="menu-brand">OMNE OS</p>
      <button type="button" data-launch="core">Core</button>
      <button type="button" data-launch="launcher">Launcher</button>
      <button type="button" data-launch="tasks">Tasks</button>
      <button type="button" data-launch="agents">Agents</button>
      <button type="button" data-launch="models">Models</button>
      <button type="button" data-launch="notifications">Notifications</button>
      <button type="button" data-launch="voice">Voice</button>
    </div>

    <footer class="taskbar">
      <button type="button" id="start" aria-controls="start-menu" aria-expanded="false">
        OMNE
      </button>
      <div class="dock" role="toolbar" aria-label="Open windows">
        <button type="button" data-task="core" hidden>Core</button>
        <button type="button" data-task="launcher" aria-pressed="false">Launcher</button>
        <button type="button" data-task="tasks" aria-pressed="true">Tasks</button>
        <button type="button" data-task="agents" hidden>Agents</button>
        <button type="button" data-task="models" hidden>Models</button>
        <button type="button" data-task="notifications" hidden>Notices</button>
        <button type="button" data-task="voice" hidden>Voice</button>
      </div>
      <div class="tray">
        <p id="character" data-state="idle">idle</p>
        <p id="tray-status" data-state="checking">checking</p>
        <time id="clock"></time>
      </div>
    </footer>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
