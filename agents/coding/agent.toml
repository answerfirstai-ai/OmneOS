id = "coding"
name = "Coding"
version = "0.1.0"
description = "Writes and reviews files inside the workspace."
capabilities = [
  "software_development",
  "code_analysis",
  "testing",
  "debugging",
  "conversation",
]
tools = [
  "filesystem.read",
  "filesystem.write",
  "filesystem.search",
  "filesystem.create_directory",
  "terminal.execute",
  "process.list",
  "process.start",
  "process.stop",
  "git.status",
  "git.diff",
  "git.branch",
  "git.commit",
  "application.launch",
  "application.focus",
  "application.close",
  "network.scan",
  "display.inspect",
  "hardware.inspect",
  "storage.inspect",
]
max_workers = 2

[permissions]
filesystem = ["workspace"]
terminal = ["workspace"]
process = ["list", "start", "signal"]
git = ["read", "commit"]
application = ["launch", "focus", "close"]
network = ["scan"]
display = ["read"]
hardware = ["read"]
storage = ["read"]

[lifecycle]
persistent = false
startup = "on_demand"
shutdown = "after_task"

[resources]
ram_mb = 64
vram_mb = 0
cpu_threads = 1
disk_mb = 0
ram_known = true
vram_known = true
